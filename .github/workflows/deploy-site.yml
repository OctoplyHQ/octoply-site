# Deploys the static Octoply site (site/) to Netlify on the Octoply account.
#
#   push to main           → preview at main--<site>.netlify.app
#   pull request into main → preview at pr-<number>--<site>.netlify.app,
#                            linked in a comment on the PR
#   push to release        → production (the live site)
#
# Netlify's own Git integration isn't used because a free Netlify account
# can't connect a private repository owned by a GitHub organisation.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  personal access token from the Octoply Netlify account
#   NETLIFY_SITE_ID     the site's ID (Netlify → Site configuration → Site details)
# Until both exist, the workflow skips the deploy instead of failing.

name: Deploy site

on:
  push:
    branches: [main, release]
    paths: ["site/**", "netlify.toml", ".github/workflows/deploy-site.yml"]
  pull_request:
    branches: [main]
    paths: ["site/**", "netlify.toml", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# One deploy at a time per branch or PR; a newer push replaces a queued one.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Check Netlify secrets
        id: secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID is not set, so nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      # There is no build step: netlify.toml points Netlify at site/ and
      # supplies the redirects and headers.
      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            args="--alias pr-$PR"; msg="Preview for PR #$PR ($SHA)"; key=deploy_url
          elif [ "$BRANCH" = "release" ]; then
            args="--prod"; msg="Release: $SHA"; key=url
          else
            # main, or a manual run on any other branch: a branch preview.
            alias=$(echo "$BRANCH" | tr -c 'a-zA-Z0-9-\n' '-' | cut -c1-37)
            args="--alias $alias"; msg="Preview of $BRANCH ($SHA)"; key=deploy_url
          fi
          npx --yes netlify-cli@27 deploy --no-build --dir site $args \
            --message "$msg" --json > deploy.json
          url=$(jq -r ".$key" deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Deployed::$url"

      - name: Comment preview link on the pull request
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "Preview: ${{ steps.deploy.outputs.url }} (updated for ${{ github.sha }})"
